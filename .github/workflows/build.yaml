name: Build and validate pinned module
on:
  push:
    branches: [codex/sync-kernelpatch]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          package_json_file: webui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml
      - name: Runtime regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/test_webui.mjs
      - name: Build pinned module
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KPatch-Next-Module-${{ github.sha }}
          path: out/*
          if-no-files-found: error
